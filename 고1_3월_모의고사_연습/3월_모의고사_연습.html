:root{--navy:#172b4d;--blue:#365fd4;--line:#dce3ed;--bg:#f3f5f8;--muted:#65758b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202b3c;font:15px/1.65 system-ui,'Malgun Gothic',sans-serif}.head{background:var(--navy);color:white;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.head b{font-size:18px}.timer{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700}.layout{max-width:1240px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}.pill{font-size:13px;color:var(--blue);font-weight:700}.qtitle{font-size:18px;font-weight:750;margin:8px 0}.passage{white-space:pre-line;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:8px;padding:16px;margin:14px 0;line-height:1.85}.choice{display:flex;gap:10px;padding:9px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}.choice:hover{background:#f4f6fc}.choice input{accent-color:var(--blue);margin-top:5px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}button{font:inherit;border:0;border-radius:8px;background:var(--blue);color:white;padding:10px 15px;cursor:pointer;font-weight:650}button.secondary{background:#e9edf5;color:#26364e}button.danger{background:#b63c49}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.num{padding:7px 0;background:#f3f5f8;color:#35445c;border:1px solid var(--line)}.num.active{outline:2px solid var(--blue)}.num.done{background:#dfe8ff;color:#203c8b}.side h3{margin:0 0 10px}.legend{font-size:12px;color:var(--muted);margin:8px 0 16px}.status{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}.results h2{margin-top:0}.score{font-size:32px;color:var(--blue);font-weight:800}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:85px 1fr 50px;gap:8px;align-items:center}.bar{background:#edf0f5;border-radius:8px;overflow:hidden;height:12px}.fill{background:#5275df;height:100%}.note{background:#f2f6ff;border-left:4px solid var(--blue);padding:12px;margin:10px 0;border-radius:6px}.resultq{border-top:1px solid var(--line);padding:12px 0}.hide{display:none}.fine{font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:-1}.head{padding:14px}.passage{font-size:14px}}@media print{.head,.layout{display:block}.side,.actions,button{display:none!important}.card{border:0}.hide{display:block}}
</style></head><body><header class="head"><b>고1 3월 국어 모의고사 연습</b><div><span class="timer" id="timer">60:00</span> <span class="fine" style="color:#cbd5e5">남은 시간</span></div></header>
<main class="layout"><section class="card" id="test"><div class="pill" id="domain"></div><div class="qtitle" id="qtitle"></div><div class="passage" id="passage"></div><div id="choices"></div><div class="actions"><button class="secondary" id="prev">이전 문항</button><button class="secondary" id="clear">답 지우기</button><button id="next">다음 문항</button></div><div class="status"><span id="counter"></span><span>답을 선택하면 오른쪽 OMR에 자동 표시됩니다.</span></div></section>

<script>
const qs=[
{d:'독서 · 정보',p:'다음 글을 읽고 물음에 답하시오.\n\n사람의 기억은 저장고처럼 정보를 그대로 보관하기보다, 필요할 때마다 단서를 바탕으로 과거의 경험을 재구성한다. 그래서 같은 일을 겪은 사람도 시간이 지난 뒤에는 서로 다르게 기억할 수 있다. 기억의 재구성은 세부를 잊게 하기도 하지만, 현재의 상황에 맞게 경험의 의미를 다시 정리하도록 돕는다. 다만 나중에 들은 정보가 원래의 기억에 섞이면 실제로 보지 않은 장면을 보았다고 믿는 오류가 생길 수 있다.',q:'윗글의 중심 내용으로 가장 적절한 것은?',o:['기억은 경험을 변형 없이 저장하므로 사람마다 달라지지 않는다.','기억은 단서를 토대로 재구성되며 이 과정에는 유용성과 오류 가능성이 함께 있다.','기억의 오류는 시간이 흐를수록 완전히 사라진다.','사람은 현재 상황과 무관하게 과거의 의미를 해석한다.','기억을 정확히 하려면 새로운 정보를 모두 차단해야 한다.'],a:1,e:'글은 기억이 재구성된다는 특성과 그 결과인 의미 재정리의 유용성, 사후 정보로 인한 오류를 함께 설명한다.'},
{d:'독서 · 정보',p:'(가) 글을 읽고 물음에 답하시오.\n\n도시의 나무는 그늘을 제공하고 빗물을 머금어 여름철 열기를 낮춘다. 그러나 나무를 많이 심는 것만으로 효과가 보장되지는 않는다. 지역의 기후와 토양에 맞지 않는 수종을 선택하면 관리 비용이 커지고 생태계에도 부담을 줄 수 있다. 따라서 도시 녹지 정책은 식재 수량뿐 아니라 종의 적합성, 기존 생태 환경, 주민의 이용 방식까지 고려해야 한다.',q:'윗글의 내용과 일치하는 것은?',o:['나무를 많이 심으면 관리 방식과 관계없이 열섬 현상이 사라진다.','도시 녹지 정책은 식재량만을 기준으로 세워야 한다.','지역 환경에 맞는 수종과 주민 이용을 함께 고려할 필요가 있다.','외래 수종은 어느 지역에서나 토종 수종보다 효과적이다.','나무는 빗물을 흡수하지 못해 도시 침수를 악화시킨다.'],a:2,e:'마지막 문장에서 수종의 적합성, 생태 환경, 주민 이용 방식을 함께 고려해야 한다고 제시한다.'},
{d:'독서 · 추론',p:'한 연구팀은 교실의 환기 횟수와 학생들의 집중도 사이의 관계를 살폈다. 환기를 자주 한 교실에서 과제 수행 시간이 짧게 나타났지만, 연구팀은 이를 환기만의 효과라고 단정하지 않았다. 창문을 여는 시간에 쉬는 시간이 함께 운영되었고, 교실마다 학생 수와 소음 수준도 달랐기 때문이다. 연구팀은 변인을 통제한 추가 실험이 필요하다고 밝혔다.',q:'연구팀의 태도로 가장 적절한 것은?',o:['관찰된 결과를 모든 교실에 즉시 일반화한다.','관련성이 나타났으므로 환기가 원인임을 확정한다.','다른 변인의 영향을 고려하여 결론을 유보한다.','연구 결과가 예상과 다르므로 자료를 폐기한다.','집중도는 측정할 수 없다고 판단한다.'],a:2,e:'연구팀은 함께 변한 요인들을 지적하며 인과관계를 단정하지 않고 추가 실험을 요구한다.'},
{d:'독서 · 정보',p:'어떤 도서관은 대출 통계를 활용해 다음 달에 필요한 책을 예상한다. 최근 대출량이 높은 책을 더 들여놓으면 이용자의 요구에 빠르게 대응할 수 있다. 하지만 통계에만 의존하면 아직 알려지지 않은 작가의 책이나 소수 독자의 요구가 반영되지 않을 수 있다. 사서의 현장 판단과 독자의 추천을 함께 활용하는 까닭이다.',q:'도서관이 통계와 사서의 판단을 함께 활용하는 이유로 적절한 것은?',o:['통계는 대출 기록을 저장할 수 없기 때문에','사서의 판단은 언제나 통계보다 정확하기 때문에','통계가 놓칠 수 있는 다양한 요구를 보완하기 위해','도서 구매 비용을 반드시 늘리기 위해','독자의 취향을 하나로 통일하기 위해'],a:2,e:'통계 기반 예측이 놓칠 수 있는 신간이나 소수의 요구를 사서 판단과 추천으로 보완한다.'},
{d:'독서 · 어휘',p:'“그의 설명은 논의의 핵심을 비껴 갔다.”',q:'밑줄 친 ‘비껴 갔다’의 문맥상 의미로 가장 적절한 것은?',o:['정면으로 맞서 해결했다.','중심에서 벗어나 다루지 않았다.','더 자세하게 설명했다.','다른 사람의 의견을 받아들였다.','논의의 범위를 넓혔다.'],a:1,e:'‘핵심을 비껴 가다’는 핵심을 직접 다루지 않고 벗어났다는 뜻이다.'},
{d:'문학 · 현대시',p:'다음 시를 읽고 물음에 답하시오.\n\n저녁 창가에 놓인 작은 화분\n하루 종일 고개를 숙였다가\n내가 물을 주자\n잎 끝에 조용히 초록을 켠다\n\n내일은 나도\n조금 더 천천히 걸어가야겠다',q:'이 시의 화자가 마지막 연에서 보이는 태도로 가장 적절한 것은?',o:['자연의 생명력을 통해 자신의 삶을 돌아보고 다짐한다.','화분을 버리고 새로운 환경으로 떠나려 한다.','하루의 실패에 분노하며 타인을 탓한다.','과거의 기억을 완전히 잊으려 한다.','자연을 관찰하는 일이 무의미하다고 판단한다.'],a:0,e:'화분이 물을 받고 다시 생기를 얻는 모습을 본 뒤 자신도 천천히 걸어가겠다고 다짐한다.'},
{d:'문학 · 현대시',p:'“골목 끝 가로등 하나가 밤의 어깨를 가만히 짚어 주었다.”',q:'위 표현에 대한 설명으로 적절한 것은?',o:['가로등에 사람의 행동을 부여해 위로의 느낌을 만든다.','가로등의 밝기를 수치로 객관화한다.','밤과 가로등의 색을 대조해 비판한다.','직유를 사용해 가로등을 밤과 동일시한다.','반복되는 의성어로 소리를 강조한다.'],a:0,e:'‘어깨를 짚어 주었다’는 사람의 행동을 가로등에 부여한 의인 표현이며, 따뜻한 위로를 전달한다.'},
{d:'문학 · 현대소설',p:'다음 글을 읽고 물음에 답하시오.\n\n“그 우산, 네가 가져.” 지후가 말했다.\n“너는?”\n“나는 뛰어가면 돼.”\n나는 우산 손잡이를 쥔 채 잠시 망설였다. 지후의 운동화 앞코는 이미 물에 젖어 있었다. 빗소리가 커지자 나는 우산을 반으로 기울였다. 지후는 아무 말 없이 내 쪽으로 한 걸음 다가왔다.',q:'‘나’의 심리를 짐작한 내용으로 가장 적절한 것은?',o:['지후의 배려를 알아차리고 함께 비를 피하려 한다.','우산을 빼앗길까 두려워 도망치려 한다.','지후가 거짓말한다고 확신하며 화를 낸다.','비가 그칠 때까지 혼자 기다리려 한다.','우산이 필요 없다고 생각해 버리려 한다.'],a:0,e:'지후가 자신에게 우산을 주려는 배려를 알아차리고 우산을 기울여 함께 쓰도록 행동한다.'},
{d:'문학 · 현대소설',p:'“정말 대단한 계획이네. 하루 만에 산을 옮기겠다니.” 친구는 웃으며 말했다. 하지만 그는 삽을 내려놓지 않았다.',q:'친구의 말에 담긴 표현 방식으로 가장 적절한 것은?',o:['칭찬하는 말의 형식을 빌려 계획의 무모함을 비꼰다.','인물의 행동을 직접 설명하는 서술이다.','상대방을 진심으로 격려하는 말이다.','상황을 객관적으로 분석하는 보고이다.','과거 사건을 회상하는 독백이다.'],a:0,e:'‘대단한 계획’이라는 칭찬의 형식으로 하루 만에 산을 옮긴다는 무모함을 비꼬는 반어적 표현이다.'},
{d:'문학 · 고전',p:'옛이야기에서 가난한 나무꾼은 산에서 다친 학을 정성껏 돌려보냈다. 얼마 뒤 학은 씨앗 하나를 물어다 주었고, 씨앗에서 자란 나무는 마을 사람들에게 열매를 나누어 주었다.',q:'이 이야기에서 드러나는 가치로 가장 적절한 것은?',o:['이익을 얻기 위해 약자를 이용해야 한다.','작은 선행과 보살핌이 공동체의 행복으로 이어질 수 있다.','자연은 인간의 삶과 무관하다.','부를 얻으려면 다른 사람과 나누지 않아야 한다.','우연한 행운만이 삶을 바꿀 수 있다.'],a:1,e:'나무꾼의 보살핌이 씨앗으로 돌아오고 그 열매가 마을에 나누어져 선행과 나눔의 가치를 보여 준다.'},
{d:'문학 · 수필',p:'나는 오래된 시장을 걸을 때마다 어릴 적 어머니의 손을 떠올린다. 손은 작았던 내 손을 꼭 쥐고 있었고, 나는 그 온기만 믿고 낯선 골목을 따라갔다. 이제는 내가 어머니의 느린 걸음에 맞춰 걷는다.',q:'이 글의 서술 방식과 정서에 대한 설명으로 적절한 것은?',o:['개인적 경험을 바탕으로 현재와 과거를 연결하며 애틋함을 드러낸다.','객관적 자료를 제시하여 시장의 역사를 설명한다.','허구적 사건을 통해 인물 간 갈등을 해결한다.','대화와 무대 지시로 사건을 진행한다.','풍자적 과장을 통해 사회 제도를 비판한다.'],a:0,e:'시장 경험과 어린 시절 기억을 연결하고, 현재 어머니의 걸음에 맞추는 장면에서 애틋함을 드러낸다.'},
{d:'문학 · 극',p:'(무대: 비어 있는 교실. 창밖에서 종소리가 들린다.)\n민서: 아직도 아무도 안 왔어?\n도윤: (칠판을 바라보며) 누군가는 먼저 시작해야지.\n민서: 그럼 나도 의자를 옮길게.',q:'괄호 속 지시문의 기능으로 가장 적절한 것은?',o:['인물의 미래를 서술한다.','무대 상황과 인물의 행동을 관객에게 안내한다.','작품의 주제를 직접 해설한다.','인물의 과거를 회상하게 한다.','장면과 무관한 정보를 제공한다.'],a:1,e:'무대 배경과 행동을 제시하는 지시문으로 공연 상황을 안내한다.'},
{d:'문법 · 어휘',p:'‘아이들이 운동장에서 신나게 뛰었다.’',q:'이 문장에서 ‘신나게’의 문장 성분은?',o:['주어','목적어','관형어','부사어','보어'],a:3,e:'‘신나게’는 용언 ‘뛰었다’를 꾸며 주는 부사어이다.'},
{d:'문법 · 문장',p:'① 바람이 분다. ② 꽃이 피었다. ③ 아이가 웃는다. ④ 우리는 노래를 불렀다. ⑤ 동생은 학생이 되고 형은 집에 갔다.',q:'겹문장은 어느 것인가?',o:['①','②','③','④','⑤'],a:4,e:'⑤는 ‘동생은 학생이 되다’와 ‘형은 집에 가다’라는 두 절이 연결 어미 ‘-고’로 이어진 겹문장이다.'},
{d:'문법 · 문장',p:'“비가 그치면 운동장에 나가자.”',q:'앞 절과 뒤 절의 관계를 바르게 설명한 것은?',o:['앞 절이 뒤 절의 조건이 된다.','앞 절이 뒤 절의 이유가 된다.','두 절이 서로 대조된다.','앞 절이 뒤 절의 목적이 된다.','앞 절이 뒤 절의 양보를 나타낸다.'],a:0,e:'연결 어미 ‘-면’은 앞의 상황을 뒤 내용의 조건으로 나타낸다.'},
{d:'문법 · 높임',p:'다음 중 주체 높임 표현이 쓰인 문장은?',o:['할머니께서 진지를 드신다.','나는 선생님께 편지를 드렸다.','손님을 모시고 왔다.','동생이 형에게 책을 주었다.','친구에게 말씀을 전했다.'],a:0,e:'‘할머니께서’의 주어를 조사 ‘께서’와 ‘드시다’로 높이고 있다. 다른 문장은 객체 높임이나 높임 어휘에 해당한다.'},
{d:'문법 · 표현',p:'“이번 발표는 완벽했어. 질문에 하나도 답하지 못했지만 말이야.”',q:'이 표현에서 두드러지는 것은?',o:['겉말과 실제 평가가 반대로 나타나는 반어','대상을 직접 비교하는 직유','말소리를 흉내 내는 의성','인간이 아닌 대상에 생명을 부여하는 의인','뜻을 강조하기 위한 반복'],a:0,e:'‘완벽했다’는 말과 질문에 답하지 못한 실제 상황이 어긋나 반어의 효과를 낸다.'}
];
let at=0,ans=Array(qs.length).fill(null),submitted=false,seconds=3600;const $=x=>document.getElementById(x);function draw(){let x=qs[at];$('domain').textContent=`${at+1}번 · ${x.d}`;$('qtitle').textContent=x.q;$('passage').textContent=x.p;$('counter').textContent=`${at+1} / ${qs.length} 문항`;$('choices').innerHTML=x.o.map((v,i)=>`<label class="choice"><input type="radio" name="pick" ${ans[at]===i?'checked':''} ${submitted?'disabled':''} value="${i}"><span>${i+1}. ${v}</span></label>`).join('');document.querySelectorAll('input[name=pick]').forEach(el=>el.onchange=()=>{ans[at]=+el.value;drawOMR()});$('prev').disabled=at===0;$('next').textContent=at===qs.length-1?'마지막 문항':'다음 문항';drawOMR()}function drawOMR(){$('omr').innerHTML=ans.map((v,i)=>`<button class="num ${v!==null?'done':''} ${i===at?'active':''}" onclick="at=${i};draw()">${i+1}${v!==null?' · '+(v+1):''}</button>`).join('');let n=ans.filter(x=>x!==null).length;$('answered').textContent=`응답 ${n}개`;$('unanswered').textContent=`미응답 ${qs.length-n}개`}
$('prev').onclick=()=>{at--;draw()};$('next').onclick=()=>{at=Math.min(qs.length-1,at+1);draw()};$('clear').onclick=()=>{ans[at]=null;draw()};$('submit').onclick=()=>{if(submitted)return;let blank=ans.filter(x=>x===null).length;if(blank&& !confirm(`미응답 ${blank}문항이 있습니다. 제출할까요?`))return;submitted=true;clearInterval(clock);grade()};let clock=setInterval(()=>{seconds--;let m=Math.floor(seconds/60),s=seconds%60;$('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(seconds<=0){$('submit').click()}},1000);
function grade(){let n=0,by={};qs.forEach((q,i)=>{let d=q.d.startsWith('독서')?'독서':q.d.startsWith('문학')?'문학':'문법';by[d]??={ok:0,total:0};by[d].total++;if(ans[i]===q.a){n++;by[d].ok++}});$('total').textContent=`${n} / ${qs.length} 정답 · ${Math.round(n/qs.length*100)}점`;$('summary').textContent=`응답 ${ans.filter(x=>x!==null).length}개 · 오답 ${qs.length-n}개. 이 연습 세트는 자체 제작 문항으로 구성되어 실제 평가 점수나 등급을 예측하지 않습니다.`;$('bars').innerHTML=Object.entries(by).map(([d,v])=>`<div class="barrow"><b>${d}</b><div class="bar"><div class="fill" style="width:${v.ok/v.total*100}%"></div></div><span>${v.ok}/${v.total}</span></div>`).join('');let weak=Object.entries(by).sort((a,b)=>a[1].ok/a[1].total-b[1].ok/b[1].total);$('advice').innerHTML=weak.slice(0,3).map(([d,v])=>`<div class="note"><b>${d} (${v.ok}/${v.total})</b><br>${d==='독서'?'지문에서 핵심 주장과 근거를 표시한 뒤 선택지의 범위·인과 표현을 대조해 보세요.':d==='문학'?'화자의 말과 행동, 표현상 특징을 근거로 정서와 주제를 추론해 보세요.':'개념 이름을 외우는 데서 그치지 말고 문장 안에서 해당 표현의 기능을 설명해 보세요.'}</div>`).join('');$('review').innerHTML=qs.map((q,i)=>`<div class="resultq"><b>${i+1}번 · ${q.d} · ${ans[i]===q.a?'정답':'오답'} · 정답 ${q.a+1}번</b><div>${q.e}</div></div>`).join('');$('results').classList.remove('hide');$('test').classList.add('hide');document.querySelector('.side').classList.add('hide');window.scrollTo(0,0)}draw();
</script></body></html>
