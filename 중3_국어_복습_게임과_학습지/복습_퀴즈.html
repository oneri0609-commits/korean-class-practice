<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중3 국어 개념 복습 게임</title>
<style>
:root{--ink:#203047;--muted:#68788d;--blue:#3c67db;--pale:#eef3ff;--line:#dce4ef;--green:#16835b;--red:#c74b51}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.65 system-ui,"Malgun Gothic",sans-serif}.wrap{max-width:900px;margin:36px auto;padding:0 18px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 5px 20px #2030470a}.hero{background:linear-gradient(120deg,#edf2ff,#f7faff);margin-bottom:16px}h1{margin:0 0 6px;font-size:27px}h2{font-size:20px;margin:0 0 14px}.muted{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}button,select{font:inherit}button{border:0;background:var(--blue);color:white;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}button.secondary{background:#e9eef8;color:var(--ink)}button:disabled{opacity:.55;cursor:default}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.toolbar select{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}.tag{background:var(--pale);color:var(--blue);padding:4px 10px;border-radius:99px;font-size:14px}.q{font-size:21px;font-weight:750;margin:14px 0}.passage{background:#f7f8fa;border-left:4px solid #9badde;padding:13px 16px;border-radius:6px;white-space:pre-line;margin:12px 0}.choices{display:grid;gap:9px}.choice{text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}.choice:hover{border-color:var(--blue);background:#f7f9ff}.choice.chosen{border:2px solid var(--blue);background:var(--pale)}.feedback{margin-top:14px;padding:14px;border-radius:10px}.correct{background:#e9f7f0;color:#155c42}.wrong{background:#fff0ef;color:#89343c}.stats{font-weight:700}.hide{display:none}.footer{font-size:13px;color:var(--muted);margin-top:12px}a{color:var(--blue)}
</style></head><body><main class="wrap"><header class="hero"><h1>중3 국어 개념 복습 게임</h1><div>문법과 문학 핵심 개념을 퀴즈로 확인해요. 답을 고르면 바로 해설을 볼 수 있어요.</div></header>
<section class="panel"><div class="toolbar"><div class="row" style="flex:2"><label>영역 <select id="filter"><option value="전체">전체</option><option>문법</option><option>문학</option></select></label><span class="stats" id="score">맞힌 문제 0 / 0</span></div><button class="secondary" id="shuffle">문제 섞기</button></div>
<div id="quiz"><div class="row"><span class="tag" id="category"></span><span class="muted" id="progress"></span></div><div class="q" id="question"></div><div class="passage hide" id="passage"></div><div class="choices" id="choices"></div><div id="feedback" class="hide"></div><div class="row" style="margin-top:16px"><button class="secondary" id="prev">이전</button><button id="next">다음 문제</button></div></div><div class="footer">총 16문제 · 중학교 1~3학년 교육과정의 대표 개념을 바탕으로 구성했습니다.</div></section></main>
<script>
const bank=[
{c:'문법',q:'다음 중 단어의 형성 방법이 나머지와 다른 것은?',o:['풋사과','덧신','밤낮','맨손'],a:2,e:'밤낮은 ‘밤’과 ‘낮’이 결합한 합성어예요. 나머지는 접사가 어근에 붙어 만들어진 파생어입니다.'},
{c:'문법',q:'‘아이가 운동장에서 신나게 뛰었다.’에서 ‘신나게’의 품사는?',o:['명사','관형사','부사','감탄사'],a:2,e:'‘신나게’는 용언 ‘뛰었다’를 꾸며 주므로 부사어로 쓰인 부사입니다.'},
{c:'문법',q:'‘꽃이 예쁘다.’에서 주어와 서술어의 관계를 바르게 설명한 것은?',o:['꽃이 목적어, 예쁘다가 서술어','꽃이 주어, 예쁘다가 서술어','꽃이 부사어, 예쁘다가 관형어','꽃이 보어, 예쁘다가 서술어'],a:1,e:'무엇이 어떠한지를 나타내는 문장으로, ‘꽃이’는 주어이고 ‘예쁘다’는 서술어입니다.'},
{c:'문법',q:'‘읽히다’의 형태소를 분석한 것으로 알맞은 것은?',o:['읽- + -히- + -다','읽히- + 다','읽- + 히다','읽다 + -히-'],a:0,e:'‘읽-’은 어근, ‘-히-’는 피동 접사, ‘-다’는 어미입니다.'},
{c:'문법',q:'다음 중 높임 표현이 쓰인 문장은?',o:['할머니께서 진지를 드신다.','친구가 밥을 먹는다.','나는 책을 읽었다.','동생이 학교에 간다.'],a:0,e:'‘할머니께서’의 주체 높임과 ‘진지·드시다’의 높임 어휘가 사용되었습니다.'},
{c:'문법',q:'‘비가 오지만 소풍을 간다.’의 연결 어미 ‘-지만’이 나타내는 의미는?',o:['이유','대조','조건','시간'],a:1,e:'앞 절과 뒤 절의 내용이 서로 반대되거나 대조됨을 나타냅니다.'},
{c:'문법',q:'‘나는 그 소식을 들었다.’에서 ‘그’의 품사는?',o:['대명사','관형사','형용사','조사'],a:1,e:'‘그’는 뒤의 명사 ‘소식’을 꾸며 주는 관형사입니다.'},
{c:'문법',q:'‘바람이 차다.’의 ‘차다’와 같은 품사인 것은?',o:['찬 물을 마셨다.','공을 차다.','발이 차다.','자리를 차지하다.'],a:2,e:'‘바람이 차다’의 ‘차다’는 성질이나 상태를 나타내는 형용사입니다. ‘발이 차다’도 형용사예요.'},
{c:'문학',q:'시에서 ‘밤은 검은 망토를 두르고 마을을 덮었다.’에 쓰인 표현 방법은?',o:['직유법','은유법','의인법','반어법'],a:2,e:'밤이 망토를 두르는 행동을 하는 것처럼 표현했으므로 의인법입니다.'},
{c:'문학',q:'소설에서 인물의 말과 행동을 통해 성격을 드러내는 방법은?',o:['간접 제시','직접 제시','배경 제시','시점 교체'],a:0,e:'인물의 대화나 행동을 독자가 보고 성격을 짐작하는 것은 간접 제시입니다.'},
{c:'문학',q:'서술자가 작품 속 인물로 등장해 자신이 겪은 일을 말하는 시점은?',o:['전지적 작가 시점','1인칭 주인공 시점','3인칭 관찰자 시점','작가 관찰자 시점'],a:1,e:'주인공이 ‘나’로 등장해 자신의 이야기를 전달하므로 1인칭 주인공 시점입니다.'},
{c:'문학',q:'극 갈래의 특징으로 가장 알맞은 것은?',o:['인물의 행동과 대사를 중심으로 사건을 보여 준다.','운율과 압축된 언어로 정서를 표현한다.','글쓴이의 주장과 근거를 제시한다.','정보를 객관적으로 설명한다.'],a:0,e:'극은 대사와 행동을 중심으로 사건을 현재 눈앞에서 펼쳐 보이는 갈래입니다.'},
{c:'문학',q:'시의 화자가 ‘너’를 부르며 말을 건네듯 표현할 때 두드러지는 특징은?',o:['대화적 어조','객관적 설명','시간적 역전','공간적 이동'],a:0,e:'청자에게 직접 말을 건네는 듯한 표현은 대화적 어조를 형성합니다.'},
{c:'문학',q:'소설에서 사건이 일어나는 시간과 장소를 가리키는 것은?',o:['갈등','배경','주제','문체'],a:1,e:'배경은 사건이 벌어지는 시간적·공간적 환경입니다.'},
{c:'문학',q:'‘웃으며 떠났지만 마음 한쪽은 무거웠다.’에서 겉으로 드러난 태도와 내면의 마음이 어긋나는 표현은?',o:['역설','반어','풍자','상징'],a:1,e:'겉으로 드러난 모습과 실제 속마음이 반대로 나타나므로 반어적 표현입니다.'},
{c:'문학',q:'작품의 주제를 파악할 때 가장 적절한 방법은?',o:['제목만 보고 내용을 단정한다.','인물·사건·표현을 종합해 중심 의미를 찾는다.','모르는 낱말 하나로 주제를 정한다.','작가의 생애만으로 해석한다.'],a:1,e:'주제는 작품 전체의 인물, 사건, 표현과 그 변화를 함께 살펴 도출해야 합니다.'}
];
let items=[...bank],idx=0,answers={},checked={},correct=0;
const $=id=>document.getElementById(id);function render(){if(!items.length){$('question').textContent='이 영역에는 문제가 없습니다.';$('choices').innerHTML='';return}let x=items[idx];$('category').textContent=x.c;$('progress').textContent=`${idx+1} / ${items.length}`;$('question').textContent=x.q;$('passage').classList.add('hide');$('choices').innerHTML='';x.o.forEach((v,n)=>{let b=document.createElement('button');b.className='choice'+(answers[idx]===n?' chosen':'');b.textContent='가나다라마바사'[n]+'. '+v;b.onclick=()=>{if(checked[idx])return;answers[idx]=n;checked[idx]=true;if(n===x.a)correct++;render();let f=$('feedback');f.className='feedback '+(n===x.a?'correct':'wrong');f.innerHTML=`<b>${n===x.a?'정답이에요!':'다시 확인해 봐요.'}</b><br>${x.e}`;$('score').textContent=`맞힌 문제 ${correct} / ${Object.keys(checked).length}`};$('choices').appendChild(b)});$('feedback').className='hide';if(checked[idx]){let f=$('feedback'),n=answers[idx];f.className='feedback '+(n===x.a?'correct':'wrong');f.innerHTML=`<b>${n===x.a?'정답이에요!':'다시 확인해 봐요.'}</b><br>${x.e}`}$('prev').disabled=idx===0;$('next').textContent=idx===items.length-1?'처음으로':'다음 문제'}
$('next').onclick=()=>{idx=idx===items.length-1?0:idx+1;render()};$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('filter').onchange=e=>{let f=e.target.value;items=bank.filter(x=>f==='전체'||x.c===f);idx=0;answers={};checked={};correct=0;$('score').textContent='맞힌 문제 0 / 0';render()};$('shuffle').onclick=()=>{items.sort(()=>Math.random()-.5);idx=0;render()};render();
</script></body></html>
